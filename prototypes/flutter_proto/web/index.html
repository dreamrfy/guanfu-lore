<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="A new Flutter project.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="flutter_proto">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>P0-T02 Flutter 原型</title>
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <!--
    自定义引导：渲染引擎（CanvasKit）用本地 canvaskit/，字体回退用本地 fonts.gstatic/
    （build 不自带字体；web/fonts.gstatic/ 是从 gstatic.loli.net 镜像拉取的 37 个 woff2，
    每次 flutter build 会自动复制进产物），不从 Google 服务器下载（国内网络不可达）。
    详见 https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script>
    {{flutter_js}}
    {{flutter_build_config}}
    _flutter.loader.load({
      config: {
        canvasKitBaseUrl: "canvaskit/",
        fontFallbackBaseUrl: "fonts.gstatic/"
      }
    });
  </script>
</body>
</html>
