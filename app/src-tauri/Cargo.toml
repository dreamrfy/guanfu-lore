[package]
name = "guanfu-lore"
version = "0.1.1"
description = "观复 · Lore · 桌面壳"
edition = "2021"
rust-version = "1.77"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# 发布版体积优先：opt-level=s + lto + 去掉调试符号
[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
